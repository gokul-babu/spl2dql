[web_index]
definition = index=web

[security_content_summariesonly]
definition = summariesonly=false allow_old_summaries=true fillnull_value=NULL

[security_content_ctime(1)]
args = field
definition = convert timeformat="%Y-%m-%dT%H:%M:%S" ctime($field$)

[business_hours]
definition = if(tonumber(strftime(now(), "%H")) >= 9, "date_hour>=9 date_hour<17", "date_hour>=0")
iseval = 1
