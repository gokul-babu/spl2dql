[linux_secure]
EXTRACT-ssh_failure = Failed password for (?:invalid user )?(?<user>\S+) from (?<src_ip>\d+\.\d+\.\d+\.\d+) port (?<src_port>\d+)
REPORT-sshd = sshd_pid, sshd_csv

[access_combined]
EXTRACT-request = "(?<method>GET|POST|PUT|DELETE|HEAD) (?<uri>\S+) HTTP/1\.\d" (?<status>\d{3}) (?<bytes>\d+)
