# Saved searches of the sample app. Each stanza is one search.

[default]
dispatch.earliest_time = -24h@h
dispatch.latest_time = now

[Web - error rate by host]
description = Share of server errors per host
search = `web_index` sourcetype=access_combined \
| stats count as total, count(eval(status>=500)) as errors by host \
| eval error_pct=round(errors/total*100, 2) \
| where error_pct > 1 \
| sort - error_pct

[Web - slow requests]
search = `web_index` sourcetype=access_combined \
| rex "duration=(?<duration_ms>\d+)" \
| where duration_ms > 2000 \
| stats count, avg(duration_ms) as avg_ms by uri \
| sort - count
dispatch.earliest_time = -60m@m
cron_schedule = */15 * * * *
enableSched = 1

[Web - hosts not reporting]
search = `web_index` | stats latest(_time) as last_seen by host | eval idle_min=round((now()-last_seen)/60, 0) | where idle_min > 15
dispatch.earliest_time = -4h
cron_schedule = */5 * * * *
enableSched = 1

[Auth - failed SSH logins by source]
description = Brute force candidates
search = eventtype=failed_ssh | stats count by src_ip, user | where count > 5 | sort - count

[Auth - privileged sessions]
search = tag=privileged tag=authentication | stats count by user, host

[Auth - failures from the data model]
search = | tstats summariesonly=true count from datamodel=Authentication where Authentication.action=failure by Authentication.user, Authentication.src \
| `drop_dm_object_name(Authentication)` \
| where count > 10

[Endpoint - encoded PowerShell]
search = | tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where Processes.process_name=powershell.exe Processes.process="*-enc*" by Processes.dest Processes.user Processes.process \
| `drop_dm_object_name(Processes)` \
| `security_content_ctime(firstTime)` \
| `security_content_ctime(lastTime)`

[Web - sessions (needs manual work)]
search = `web_index` | transaction JSESSIONID maxpause=5m | stats avg(duration) as avg_session, avg(eventcount) as avg_pages

[Old weekly report]
disabled = 1
search = index=legacy | top 20 uri
