name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The versions pinned in mise.toml; this row also runs coverage and the browser tests.
          - { os: ubuntu-latest, node: pinned, full: true }
          # The oldest Node the packages claim to support.
          - { os: ubuntu-latest, node: "24", full: false }
          - { os: windows-latest, node: pinned, full: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Use Node ${{ matrix.node }} instead of the pinned one
        if: matrix.node != 'pinned'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit
      - name: Build
        run: pnpm build
      - name: Typecheck, lint, tests, boundaries, network scan
        run: pnpm check
      - name: Coverage thresholds
        if: matrix.full
        run: pnpm test:coverage
      - name: Install Playwright browser
        if: matrix.full
        run: pnpm --filter @spl2dql/web exec playwright install --with-deps chromium
      - name: End-to-end (accessibility, offline, local server security)
        if: matrix.full
        run: pnpm test:e2e
      - name: Packages contain only what they should
        if: matrix.full
        run: node scripts/check-packages.ts

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download gitleaks (pinned by checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks && rm gitleaks.tar.gz
      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .'

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
