name: release

# A tag vX.Y.Z on main publishes both npm packages (with provenance, through npm trusted
# publishing: no token is stored anywhere), attaches them to a GitHub release, and deploys the
# web app. docs/RELEASING.md describes the steps around it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main and matches both package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          for f in packages/core/package.json packages/cli/package.json; do
            v="v$(node -p "require('./$f').version")"
            [ "$v" = "$TAG" ] || { echo "$f is $v but the tag is $TAG"; exit 1; }
          done
          grep -q "^## \[${TAG#v}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: false # a release is built from scratch, never from a cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm build
      - run: pnpm check
      - run: pnpm --filter @spl2dql/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Pack
        run: |
          mkdir -p out/npm
          pnpm --filter @spl2dql/core pack --pack-destination "$PWD/out/npm"
          pnpm --filter spl2dql pack --pack-destination "$PWD/out/npm"
          node scripts/check-packages.ts out/npm
          cp -R apps/web/dist out/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out
          if-no-files-found: error
          retention-days: 7

  npm:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Give this environment required reviewers in the repository settings to make every release
    # wait for a person. The same name is entered at npmjs.com with the trusted publisher.
    environment: npm
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a short-lived publish credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm is new enough for trusted publishing
        run: node -e "const [a,b,c]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm 11.5.1 or later is required'); process.exit(1) }"
      - name: Publish (the library first; a version that is already there is skipped)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v="${VERSION#v}"
          publish() { # name tarball
            if npm view "$1@$v" version >/dev/null 2>&1; then echo "$1@$v is already published"; return; fi
            npm publish "$2" --access public
          }
          publish @spl2dql/core "out/npm/spl2dql-core-$v.tgz"
          publish spl2dql "out/npm/spl2dql-$v.tgz"

  github-release:
    name: GitHub release
    needs: [verify, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and attach the packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$TAG" out/npm/*.tgz --title "$TAG" --notes-file notes.md --verify-tag

  site:
    name: deploy the web app
    needs: [verify, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: site
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_VERSION: 4.162.0
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No Cloudflare token is configured for the 'site' environment, so the page was not deployed. See docs/RELEASING.md."
            exit 0
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy out/site --project-name spl2dql --branch main --commit-dirty=true
